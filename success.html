<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Confirmé — YourPass</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <link rel="stylesheet" href="logo-fix.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        .success-page {
            min-height: 100vh;
            background: var(--gray-50, #f9fafb);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 16px 48px;
        }
        .state-card {
            background: #fff;
            border-radius: 20px;
            padding: 48px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            display: none;
        }
        .state-card.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .icon-box { width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; }
        .icon-success { background: #ecfdf5; color: #10b981; }
        .icon-error { background: #fef2f2; color: #ef4444; }
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .btn-primary { 
            background: #2563eb; color: white; border: none; padding: 14px 28px; 
            border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s; 
            text-decoration: none; display: inline-block; margin-top: 20px;
        }
        .btn-primary:hover { background: #1d4ed8; }
        
        #qrcode-canvas { margin: 20px auto; max-width: 100%; }
        
        @media print {
            .navbar, .btn-primary, .nav-menu { display: none !important; }
            .success-page { padding: 0; background: white; }
            .state-card { box-shadow: none; border: 1px solid #eee; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="image video/téléchargement (1).png" alt="YourPass Logo">
            </div>
        </div>
    </nav>

    <main class="success-page">
        <div id="state-loading" class="state-card active">
            <div class="loader"></div>
            <h2>Vérification du paiement...</h2>
            <p id="loading-msg">Nous confirmons votre transaction auprès de FedaPay.</p>
        </div>

        <div id="state-success" class="state-card">
            <div class="icon-box icon-success">
                <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 id="success-title">Paiement Réussi !</h2>
            <p>Votre ticket a été généré et envoyé par email.</p>
            
            <div id="ticket-info" style="margin: 24px 0; padding: 20px; background: #f9fafb; border-radius: 12px; text-align: left;">
                <p style="margin: 5px 0;"><strong>ID Transaction:</strong> <span id="display-txid">---</span></p>
                <p style="margin: 5px 0;"><strong>Événement:</strong> <span id="display-event">---</span></p>
            </div>

            <canvas id="qrcode-canvas"></canvas>

            <div style="display: flex; gap: 10px; justify-content: center;">
                <button onclick="window.print()" class="btn-primary" style="background: #10b981;">Imprimer le billet</button>
                <a href="index.html" class="btn-primary">Retour à l'accueil</a>
            </div>
        </div>

        <div id="state-error" class="state-card">
            <div class="icon-box icon-error">
                <svg width="40" height="40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </div>
            <h2 id="error-title">Oups !</h2>
            <p id="error-msg">Nous n'avons pas pu confirmer votre paiement.</p>
            <button onclick="location.reload()" class="btn-primary">Réessayer</button>
            <a href="index.html" style="display: block; margin-top: 15px; color: #6b7280;">Annuler</a>
        </div>
    </main>

    <script>
    const params = new URLSearchParams(window.location.search);
    const transactionId = params.get('id'); // FedaPay renvoie souvent l'ID
    
    // Récupérer les infos stockées temporairement dans le localStorage lors du clic sur "Payer"
    const pendingData = JSON.parse(localStorage.getItem('yourpass_pending_order') || '{}');

    function showState(stateId) {
        document.querySelectorAll('.state-card').forEach(el => el.classList.remove('active'));
        document.getElementById(stateId).classList.add('active');
    }

    async function verifyAndSend() {
        if (!transactionId) {
            document.getElementById('error-msg').textContent = "Aucun identifiant de transaction trouvé.";
            showState('state-error');
            return;
        }

        try {
            // Dans un vrai flux, on pourrait appeler une API de vérification ici.
            // Mais puisque ton Webhook gère déjà la DB, on va juste déclencher l'envoi du billet final.
            
            const response = await fetch('/api/send-ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    transactionId: transactionId,
                    email: pendingData.email,
                    name: pendingData.name,
                    eventName: pendingData.eventName || 'Événement YourPass',
                    amount: pendingData.amount
                })
            });

            const result = await response.json();

            if (response.ok) {
                // Affichage des infos
                document.getElementById('display-txid').textContent = transactionId;
                document.getElementById('display-event').textContent = pendingData.eventName || 'Confirmé';
                
                // Génération du QR Code visuel sur la page
                QRCode.toCanvas(document.getElementById('qrcode-canvas'), transactionId, {
                    width: 200,
                    margin: 2
                });

                showState('state-success');
                // Nettoyage du storage
                localStorage.removeItem('yourpass_pending_order');
            } else {
                throw new Error(result.error || "Erreur lors de la génération du billet");
            }

        } catch (err) {
            console.error('Erreur:', err);
            document.getElementById('error-msg').textContent = err.message;
            showState('state-error');
        }
    }

    document.addEventListener('DOMContentLoaded', verifyAndSend);
    </script>
</body>
</html>
