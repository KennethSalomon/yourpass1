<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation Paiement — YourPass</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .status-card {
      max-width: 480px;
      margin: 80px auto;
      padding: 40px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
      text-align: center;
      font-family: 'Inter', sans-serif;
    }
    .icon { font-size: 64px; margin-bottom: 16px; line-height: 1; }
    .status-card h2 { margin: 0 0 10px; font-size: 1.6rem; font-weight: 700; color: #1e293b; }
    .status-card p  { color: #64748b; margin: 0 0 28px; line-height: 1.6; font-size: 0.95rem; }
    .btn-home {
      display: inline-block;
      padding: 13px 36px;
      background: #1a1a2e;
      color: #fff;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-home:hover { background: #2d6cff; transform: translateY(-1px); }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid #e2e8f0;
      border-top-color: #2d6cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #debug-info {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 16px;
      font-family: monospace;
    }
    .progress-bar {
      height: 3px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin: 16px 0 0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2d6cff, #7c3aed);
      border-radius: 99px;
      transition: width 5s linear;
    }
  </style>
</head>
<body>
  <div class="status-card" id="status-card">
    <div class="spinner" id="spinner"></div>
    <h2 id="status-title">Vérification en cours…</h2>
    <p id="status-msg">Veuillez patienter pendant que nous confirmons votre paiement auprès de FedaPay.</p>
    <div class="progress-bar" id="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div id="debug-info"></div>
  </div>

  <script>
    /* ── Configuration ──────────────────────────────────────────── */
    const MAX_ATTEMPTS   = 12;   // ~60 secondes
    const POLL_INTERVAL  = 5000;
    const REDIRECT_DELAY = 3000;

    let attempts  = 0;
    let pollTimer = null;

    /* ── Récupérer l'ID de transaction ───────────────────────────
       Ordre de priorité :
       1. Paramètre URL ?id= (ajouté par FedaPay dans la callback_url)
       2. Paramètre URL ?transaction_id=
       3. localStorage (sauvegardé par main.js avant la redirection)
    ──────────────────────────────────────────────────────────── */
    function getTransactionId() {
      const params = new URLSearchParams(window.location.search);

      // FedaPay peut envoyer différents noms de paramètres
      const fromUrl = params.get('id')
                   || params.get('transaction_id')
                   || params.get('trx')
                   || params.get('reference')
                   || params.get('fedapay_id');

      if (fromUrl) {
        console.log('[Success] TX ID depuis URL:', fromUrl);
        return fromUrl;
      }

      // Fallback : localStorage (sauvegardé par main.js avant redirection)
      const fromStorage = localStorage.getItem('yourpass_pending_tx');
      if (fromStorage) {
        console.log('[Success] TX ID depuis localStorage:', fromStorage);
        return fromStorage;
      }

      // Dernier recours : données pending complètes
      try {
        const pending = JSON.parse(localStorage.getItem('yourpass_pending') || '{}');
        if (pending.transaction_id) {
          console.log('[Success] TX ID depuis pending:', pending.transaction_id);
          return String(pending.transaction_id);
        }
      } catch {}

      return null;
    }

    /* ── Afficher un état ─────────────────────────────────────── */
    function showState(type, title, msg) {
      const icons = {
        loading:   null,
        success:   '🎉',
        failed:    '❌',
        cancelled: '⚠️',
        timeout:   '⏱️',
        error:     '🔧'
      };

      const spinner     = document.getElementById('spinner');
      const progressBar = document.getElementById('progress-bar');
      const icon        = icons[type];

      if (progressBar) progressBar.style.display = 'none';

      if (icon) {
        spinner.style.display = 'none';
        // Retirer l'ancien icône s'il existe
        document.getElementById('state-icon')?.remove();
        const iconEl = document.createElement('div');
        iconEl.id = 'state-icon';
        iconEl.className = 'icon';
        iconEl.textContent = icon;
        spinner.parentNode.insertBefore(iconEl, spinner);
      } else {
        spinner.style.display = 'block';
      }

      document.getElementById('status-title').textContent = title;
      document.getElementById('status-msg').textContent   = msg;

      // Nettoyer le localStorage si état terminal
      if (type !== 'loading') {
        localStorage.removeItem('yourpass_pending_tx');
        localStorage.removeItem('yourpass_pending');
      }

      // Ajouter bouton retour si état terminal
      if (type !== 'loading') {
        const card = document.getElementById('status-card');
        if (!card.querySelector('.btn-home')) {
          const btn = document.createElement('a');
          btn.href      = 'index.html';
          btn.className = 'btn-home';
          btn.textContent = '← Retour à l\'accueil';
          card.appendChild(btn);
        }
      }
    }

    /* ── Appeler l'API de vérification ───────────────────────── */
    async function checkStatus(txId) {
      try {
        const response = await fetch(`/api/verify/${encodeURIComponent(txId)}`);
        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          console.warn('[Success] Erreur API:', response.status, err);
          return null;
        }
        return await response.json();
      } catch (err) {
        console.warn('[Success] Erreur réseau:', err.message);
        return null;
      }
    }

    /* ── Boucle de polling ────────────────────────────────────── */
    async function poll(txId) {
      if (attempts >= MAX_ATTEMPTS) {
        clearTimeout(pollTimer);
        showState('timeout',
          'Délai dépassé',
          'Nous n\'avons pas pu confirmer votre paiement automatiquement. ' +
          'Si vous avez été débité, votre billet vous sera envoyé par email sous 24h. ' +
          'Conservez votre numéro de transaction : ' + txId
        );
        return;
      }

      attempts++;

      // Mettre à jour la barre de progression visuelle
      const fill = document.getElementById('progress-fill');
      if (fill) {
        fill.style.transition = 'none';
        fill.style.width = '0%';
        setTimeout(() => {
          fill.style.transition = `width ${POLL_INTERVAL / 1000}s linear`;
          fill.style.width = '100%';
        }, 50);
      }

      const debugEl = document.getElementById('debug-info');
      if (debugEl) debugEl.textContent = `Tentative ${attempts}/${MAX_ATTEMPTS} · TX: ${txId}`;

      const data = await checkStatus(txId);

      if (!data) {
        // Erreur réseau → réessayer
        pollTimer = setTimeout(() => poll(txId), POLL_INTERVAL);
        return;
      }

      console.log('[Success] Statut reçu:', data.status);

      switch (data.status) {
        case 'completed':
          clearTimeout(pollTimer);
          showState('success',
            'Paiement confirmé !',
            `Votre paiement de ${(data.amount || 0).toLocaleString('fr-FR')} ${data.currency || 'XOF'} a été accepté. ` +
            `Votre billet vous sera envoyé par email dans quelques minutes.`
          );
          // Rediriger vers le dashboard après délai
          setTimeout(() => { window.location.href = 'dashboard.html'; }, REDIRECT_DELAY);
          break;

        case 'failed':
        case 'error':
          clearTimeout(pollTimer);
          showState('failed',
            'Paiement refusé',
            'Votre paiement n\'a pas pu être traité. Vérifiez le solde de votre compte et réessayez, ou contactez le support.'
          );
          break;

        case 'cancelled':
          clearTimeout(pollTimer);
          showState('cancelled',
            'Paiement annulé',
            'Vous avez annulé le paiement. Vous pouvez relancer depuis la page de l\'événement.'
          );
          break;

        case 'pending':
        default:
          // Continuer le polling
          pollTimer = setTimeout(() => poll(txId), POLL_INTERVAL);
          break;
      }
    }

    /* ── Initialisation ──────────────────────────────────────── */
    (function init() {
      const txId = getTransactionId();

      if (!txId) {
        showState('error',
          'Transaction introuvable',
          'Impossible de retrouver votre transaction. Si vous venez d\'effectuer un paiement, vérifiez votre email ou contactez le support avec votre numéro de téléphone.'
        );
        return;
      }

      // Sauvegarder en cas de rechargement de page
      localStorage.setItem('yourpass_pending_tx', txId);

      // Démarrer la barre de progression
      const fill = document.getElementById('progress-fill');
      if (fill) {
        setTimeout(() => {
          fill.style.transition = `width ${POLL_INTERVAL / 1000}s linear`;
          fill.style.width = '100%';
        }, 100);
      }

      console.log('[Success] Démarrage vérification pour TX:', txId);
      poll(txId);
    })();
  </script>
</body>
</html>
