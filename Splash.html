<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YourPass — Chargement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue-deep:   #050e2b;
      --blue-mid:    #0b2a6b;
      --blue-light:  #1a5fd4;
      --blue-glow:   #3b82f6;
      --blue-pale:   #93c5fd;
      --white:       #ffffff;
      --gold:        #f0c060;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Syne', sans-serif;
    }

    /* ── Fond principal ───────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 110%, #1a4fa8 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 20% 20%, #0f3d8a 0%, transparent 60%),
        linear-gradient(160deg, #06122e 0%, #071840 45%, #0a2060 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      z-index: 99999;
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    #splash.fade-out {
      opacity: 0;
      transform: scale(1.03);
      pointer-events: none;
    }

    /* ── Particules de fond ───────────────────────────────────── */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.5) 0%, transparent 70%);
      animation: float-particle linear infinite;
      pointer-events: none;
    }

    @keyframes float-particle {
      0%   { transform: translateY(110vh) scale(0.5); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
    }

    /* ── Anneau lumineux derrière le logo ─────────────────────── */
    .glow-ring {
      position: relative;
      width: 180px; height: 180px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 40px;
      animation: entrance 0.9s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes entrance {
      from { opacity: 0; transform: scale(0.6) translateY(30px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .glow-ring::before {
      content: '';
      position: absolute; inset: -18px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0%,
        rgba(59,130,246,0.6) 25%,
        rgba(147,197,253,0.8) 50%,
        rgba(59,130,246,0.6) 75%,
        transparent 100%
      );
      animation: spin-ring 3s linear infinite;
      filter: blur(2px);
    }

    .glow-ring::after {
      content: '';
      position: absolute; inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59,130,246,0.25) 0%, transparent 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse-glow {
      0%, 100% { transform: scale(1);   opacity: 0.7; }
      50%       { transform: scale(1.3); opacity: 1; }
    }

    /* ── Cercle intérieur blanc mat ───────────────────────────── */
    .logo-circle {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 2;
      box-shadow:
        0 0 40px rgba(59,130,246,0.4),
        inset 0 1px 1px rgba(255,255,255,0.2);
    }

    .logo-circle img {
      width: 100px; height: auto;
      object-fit: contain;
      filter: brightness(1.15) drop-shadow(0 0 14px rgba(147,197,253,0.7));
      animation: logo-pulse 2.5s ease-in-out infinite;
    }

    @keyframes logo-pulse {
      0%, 100% { filter: brightness(1.1) drop-shadow(0 0 12px rgba(147,197,253,0.5)); }
      50%       { filter: brightness(1.3) drop-shadow(0 0 24px rgba(147,197,253,0.9)); }
    }

    /* ── Nom de la marque ─────────────────────────────────────── */
    .brand-name {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--white);
      text-transform: uppercase;
      margin-bottom: 8px;
      opacity: 0;
      animation: slide-up 0.7s 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
      text-shadow: 0 0 30px rgba(147,197,253,0.4);
    }

    .brand-tagline {
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.3em;
      color: var(--blue-pale);
      text-transform: uppercase;
      opacity: 0;
      animation: slide-up 0.7s 0.65s ease forwards;
      margin-bottom: 60px;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Barre de progression ─────────────────────────────────── */
    .progress-wrap {
      width: 220px;
      opacity: 0;
      animation: slide-up 0.5s 0.85s ease forwards;
    }

    .progress-track {
      width: 100%; height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--blue-glow), var(--blue-pale), var(--gold));
      border-radius: 99px;
      transition: width 0.08s linear;
      box-shadow: 0 0 10px rgba(147,197,253,0.7);
    }

    .progress-label {
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: rgba(147,197,253,0.6);
      text-transform: uppercase;
      font-weight: 400;
    }

    /* ── Points clignotants ───────────────────────────────────── */
    .dots span {
      display: inline-block;
      animation: blink 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40%            { opacity: 1; }
    }

    /* ── Copyright en bas ─────────────────────────────────────── */
    .splash-footer {
      position: absolute;
      bottom: 28px;
      font-size: 0.65rem;
      color: rgba(147,197,253,0.3);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<div id="splash">

  <!-- Particules flottantes -->
  <div class="particle" style="width:6px;height:6px;left:15%;animation-duration:8s;animation-delay:0s;"></div>
  <div class="particle" style="width:4px;height:4px;left:28%;animation-duration:11s;animation-delay:2s;"></div>
  <div class="particle" style="width:8px;height:8px;left:45%;animation-duration:9s;animation-delay:1s;"></div>
  <div class="particle" style="width:5px;height:5px;left:62%;animation-duration:13s;animation-delay:3s;"></div>
  <div class="particle" style="width:6px;height:6px;left:78%;animation-duration:10s;animation-delay:0.5s;"></div>
  <div class="particle" style="width:3px;height:3px;left:88%;animation-duration:7s;animation-delay:2.5s;"></div>
  <div class="particle" style="width:7px;height:7px;left:5%;animation-duration:12s;animation-delay:4s;"></div>
  <div class="particle" style="width:4px;height:4px;left:95%;animation-duration:9s;animation-delay:1.5s;"></div>

  <!-- Logo avec anneau lumineux -->
  <div class="glow-ring">
    <div class="logo-circle">
      <!-- Remplace src par le chemin de ton logo -->
      <img src="image video/téléchargement (1).png" alt="YourPass Logo">
    </div>
  </div>

  <!-- Nom & tagline -->
  <div class="brand-name">YourPass</div>
  <div class="brand-tagline">Votre billetterie événementielle</div>

  <!-- Barre de progression -->
  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label">
      Chargement <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
  </div>

  <!-- Footer -->
  <div class="splash-footer">&copy; 2026 YourPass · Bénin</div>

</div>

<script>
  /* ══════════════════════════════════════════════════════════════
     Logique du splash screen
     - S'affiche uniquement après une CONNEXION (flag sessionStorage)
     - Barre de progression animée sur 2,2 s
     - Fondu + redirection vers index.html
  ══════════════════════════════════════════════════════════════ */

  const fill     = document.getElementById('progressFill');
  const splash   = document.getElementById('splash');
  const DEST     = 'index.html';         // page de destination
  const DURATION = 2400;                 // durée totale en ms
  const FPS      = 60;
  const STEPS    = (DURATION / 1000) * FPS;

  let step = 0;

  const tick = setInterval(() => {
    step++;
    // Courbe d'accélération douce : ease-in-out
    const t   = step / STEPS;
    const pct = t < 0.5
      ? 2 * t * t
      : -1 + (4 - 2 * t) * t;

    fill.style.width = (pct * 100).toFixed(1) + '%';

    if (step >= STEPS) {
      clearInterval(tick);
      fill.style.width = '100%';

      // Court délai pour voir les 100 %, puis fondu
      setTimeout(() => {
        splash.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = DEST;
        }, 700);
      }, 250);
    }
  }, 1000 / FPS);
</script>

</body>
</html>
