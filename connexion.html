<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | YourPass</title>
  <link rel="stylesheet" href="connexion.css">

  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="manifest" href="meta.json">
  <style>
    /* Loader pendant vérif session */
    #auth-loader {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(5px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #auth-loader.hidden { opacity: 0; pointer-events: none; }
    .loader-spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: _spin 0.7s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes _spin { to { transform: rotate(360deg); } }
    #auth-loader p { color: rgba(255,255,255,0.85); font-size: 13px; font-family: 'Poppins',sans-serif; }
    /* Messages formulaire */
    .form-msg {
      display: none; text-align: center;
      font-size: 13px; margin-top: 10px;
      padding: 8px 14px; border-radius: 20px;
      font-weight: 500; font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>

<!-- Loader -->
<div id="auth-loader">
  <div class="loader-spinner"></div>
  <p>Vérification de la session…</p>
</div>

<!-- Vidéo fond -->
<video id="bg-video" autoplay muted loop playsinline>
  <source src="image video/arrière plan.mp4" type="video/mp4">
</video>

<!-- Bouton son -->
<button id="sound-btn">🔇</button>

<div>
  <div class="wrapper">

    <!-- Navigation -->
    <nav class="nav">
      <div class="nav-logo">
        <div class="logo-container"></div>
        <div class="Logo">
          <img src="image video/téléchargement (1).png" alt="YourPass Logo">
        </div>
      </div>
      <br><br>
      <div class="nav-menu" id="navMenu">
        <ul>
          <li><a href="index.html"     class="link">Accueil</a></li>
          <li><a href="events.html"    class="link">Événements</a></li>
          <li><a href="ads.html"       class="link">Partenaires</a></li>
          <li><a href="connexion.html" class="link">Connexion</a></li>
          <li><a href="contact.html"   class="link">Contact</a></li>
          <li><a href="dashboard.html" class="link">Profil</a></li>
        </ul>
      </div>
      <div class="button">
        <button class="btn white-btn" id="loginBtn"    onclick="showLogin()">Sign In</button>
        <button class="btn"           id="registerBtn" onclick="showRegister()">Sign Up</button>
      </div>
      <div class="nav-menu-btn">
        <i class="bx bx-menu" onclick="myMenuFunction()"></i>
      </div>
    </nav>

    <!-- FORM BOX -->
    <div class="form-box">

      <!-- ═══ LOGIN ═══ -->
      <div class="login-container" id="login">
        <div class="top">
          <span>Pas de compte ? <a href="#" onclick="showRegister()">Sign Up</a></span>
          <header>Login</header>
        </div>

        <div class="input-box">
          <input type="email" class="input-field" id="login-email"
                 placeholder="Email" autocomplete="email">
          <i class="bx bx-envelope"></i>
        </div>

        <div class="input-box">
          <input type="password" class="input-field" id="login-password"
                 placeholder="Mot de passe" autocomplete="current-password">
          <i class="bx bx-lock-alt"></i>
        </div>

        <div class="input-box">
          <input type="submit" class="submit" id="login-submit" value="Sign In">
        </div>

        <p class="form-msg" id="login-msg"></p>

        <div class="two-col">
          <div class="one">
            <input type="checkbox" id="login-check">
            <label for="login-check">Se souvenir de moi</label>
          </div>
          <div class="two">
            <label><a href="#" id="forgot-link">Mot de passe oublié ?</a></label>
          </div>
        </div>
      </div>

      <!-- ═══ REGISTER ═══ -->
      <div class="register-container" id="register">
        <div class="top">
          <span>Déjà un compte ? <a href="#" onclick="showLogin()">Login</a></span>
          <header>Sign Up</header>
        </div>

        <div class="two-forms">
          <div class="input-box">
            <input type="text" class="input-field" id="reg-firstname"
                   placeholder="Firstname" autocomplete="given-name">
            <i class="bx bx-user"></i>
          </div>
          <div class="input-box">
            <input type="text" class="input-field" id="reg-lastname"
                   placeholder="Lastname" autocomplete="family-name">
            <i class="bx bx-user"></i>
          </div>
        </div>

        <div class="input-box">
          <input type="email" class="input-field" id="reg-email"
                 placeholder="Email" autocomplete="email">
          <i class="bx bx-envelope"></i>
        </div>

        <div class="input-box">
          <input type="password" class="input-field" id="reg-password"
                 placeholder="Mot de passe (min. 6 car.)" autocomplete="new-password">
          <i class="bx bx-lock-alt"></i>
        </div>

        <div class="input-box">
          <input type="submit" class="submit" id="reg-submit" value="Register">
        </div>

        <p class="form-msg" id="register-msg"></p>

        <div class="two-col">
          <div class="one">
            <input type="checkbox" id="register-check">
            <label for="register-check">J'accepte les <a href="#" style="color:#fff;text-decoration:underline;">conditions</a></label>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ════ SCRIPTS ════ -->

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-auth.js"></script>

<script src="js/profile.js"></script>

<script>
/* ════════════════════════════════════════════════════════════
   CONFIG SUPABASE
════════════════════════════════════════════════════════════ */
const _sb = window.supabase.createClient(
  'https://towojafvhdywdowrpkrn.supabase.co',
  'sb_publishable_u2DHBeNqtcd7QVdTTwU_xA_ujiqdFit'
);

/* ── UI helpers ────────────────────────────────────────────── */
function showMsg(id, msg, type) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.style.cssText = `
    display: block;
    text-align: center;
    font-size: 13px;
    margin-top: 10px;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: 500;
    font-family: 'Poppins', sans-serif;
    background: ${type === 'error' ? 'rgba(231,76,60,0.25)' : 'rgba(46,204,113,0.25)'};
    color: ${type === 'error' ? '#ff6b6b' : '#2ecc71'};
    border: 1px solid ${type === 'error' ? 'rgba(231,76,60,0.4)' : 'rgba(46,204,113,0.4)'};
  `;
  setTimeout(() => { el.style.display = 'none'; }, 5500);
}

function setBtnLoading(id, loading, label) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.disabled = loading;
  btn.value = loading ? '⏳ Chargement…' : label;
  btn.style.opacity = loading ? '0.7' : '1';
}

function translateErr(msg) {
  if (!msg) return 'Une erreur est survenue.';
  if (msg.includes('Invalid login credentials'))  return 'Email ou mot de passe incorrect.';
  if (msg.includes('Email not confirmed'))         return 'Confirme ton email avant de te connecter.';
  if (msg.includes('User already registered'))     return 'Un compte existe déjà avec cet email.';
  if (msg.includes('Password should be at least')) return 'Mot de passe trop court (minimum 6 caractères).';
  if (msg.includes('rate limit'))                  return 'Trop de tentatives. Réessaie dans 1 minute.';
  if (msg.includes('Unable to validate email'))    return 'Adresse email invalide.';
  return 'Erreur : ' + msg;
}

function hideLoader() {
  const loader = document.getElementById('auth-loader');
  if (!loader) return;
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 500);
}

/* ── Slide Login / Register ────────────────────────────────── */
function showLogin() {
  document.getElementById('login').style.cssText    = 'left:4px; opacity:1;';
  document.getElementById('register').style.cssText = 'right:-520px; opacity:0;';
  document.getElementById('loginBtn').classList.add('white-btn');
  document.getElementById('registerBtn').classList.remove('white-btn');
}
function showRegister() {
  document.getElementById('login').style.cssText    = 'left:-510px; opacity:0;';
  document.getElementById('register').style.cssText = 'right:5px; opacity:1;';
  document.getElementById('loginBtn').classList.remove('white-btn');
  document.getElementById('registerBtn').classList.add('white-btn');
}
// Alias pour les onclick inline existants
window.login    = showLogin;
window.register = showRegister;

/* ── Son vidéo ─────────────────────────────────────────────── */
const _video    = document.getElementById('bg-video');
const _soundBtn = document.getElementById('sound-btn');
_soundBtn.addEventListener('click', () => {
  _video.muted = !_video.muted;
  _soundBtn.textContent = _video.muted ? '🔇' : '🔊';
});

/* ── Menu mobile ───────────────────────────────────────────── */
function myMenuFunction() {
  document.getElementById('navMenu').classList.toggle('responsive');
}

/* ════════════════════════════════════════════════════════════
   GESTION SESSION — onAuthStateChange
   
   Écoute TOUS les événements auth en temps réel :
   ✅ SIGNED_IN      → après login manuel OU clic lien email confirmation
   ✅ INITIAL_SESSION → session déjà active (retour sur la page)
════════════════════════════════════════════════════════════ */
let _redirecting = false;

_sb.auth.onAuthStateChange((event, session) => {
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session && !_redirecting) {
    _redirecting = true;

    // Sauvegarde locale pour affichage rapide
    const u = session.user;
    localStorage.setItem('yourpass_user', JSON.stringify({
      id:    u.id,
      email: u.email,
      name:  u.user_metadata?.firstname
             ? (u.user_metadata.firstname + ' ' + (u.user_metadata.lastname || '')).trim()
             : u.email.split('@')[0]
    }));

    // Délai court pour que le message "Connexion réussie" soit visible
    setTimeout(() => {
      window.location.href = window.location.origin + 'index.html';
    }, 700);

  } else if (event === 'INITIAL_SESSION' && !session) {
    // Aucune session active → afficher les formulaires
    hideLoader();
  }
});

/* ════════════════════════════════════════════════════════════
   CONNEXION
════════════════════════════════════════════════════════════ */
document.getElementById('login-submit').addEventListener('click', async () => {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;

  if (!email || !password) {
    showMsg('login-msg', 'Remplis ton email et ton mot de passe.', 'error');
    return;
  }

  setBtnLoading('login-submit', true, 'Sign In');

  const { data, error } = await _sb.auth.signInWithPassword({ email, password });

  setBtnLoading('login-submit', false, 'Sign In');

  if (error) {
    showMsg('login-msg', translateErr(error.message), 'error');
    return;
  }

  // Sauvegarde locale pour affichage rapide (nav, dashboard)
  const u = data.user;
  localStorage.setItem('yourpass_user', JSON.stringify({
    id:    u.id,
    email: u.email,
    name:  u.user_metadata?.firstname
           ? `${u.user_metadata.firstname} ${u.user_metadata.lastname || ''}`.trim()
           : u.email.split('@')[0]
  }));

  showMsg('login-msg', '✅ Connexion réussie ! Redirection…', 'success');
  // La redirection est gérée par onAuthStateChange ci-dessus
});

/* ── Enter key sur login ────────────────────────────────────── */
['login-email', 'login-password'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-submit').click();
  });
});

/* ════════════════════════════════════════════════════════════
   INSCRIPTION
════════════════════════════════════════════════════════════ */
document.getElementById('reg-submit').addEventListener('click', async () => {
  const firstname = document.getElementById('reg-firstname').value.trim();
  const lastname  = document.getElementById('reg-lastname').value.trim();
  const email     = document.getElementById('reg-email').value.trim();
  const password  = document.getElementById('reg-password').value;
  const terms     = document.getElementById('register-check').checked;

  // Validations
  if (!firstname || !email || !password) {
    showMsg('register-msg', 'Remplis tous les champs obligatoires.', 'error');
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg('register-msg', 'Adresse email invalide.', 'error');
    return;
  }
  if (password.length < 6) {
    showMsg('register-msg', 'Le mot de passe doit faire au moins 6 caractères.', 'error');
    return;
  }
  if (!terms) {
    showMsg('register-msg', "Accepte les conditions d'utilisation.", 'error');
    return;
  }

  setBtnLoading('reg-submit', true, 'Register');

  // Création compte Supabase Auth
  const { data, error } = await _sb.auth.signUp({
    email,
    password,
    options: {
      data: { firstname, lastname },
      emailRedirectTo: window.location.origin + 'connexion.html'
    }
  });

  setBtnLoading('reg-submit', false, 'Register');

  if (error) {
    showMsg('register-msg', translateErr(error.message), 'error');
    return;
  }

  // Insertion profil dans la table `profiles` (SQL à créer dans Supabase)
  if (data.user) {
    const { error: pErr } = await _sb.from('profiles').insert({
      id:         data.user.id,
      firstname,
      lastname:   lastname || '',
      email,
      created_at: new Date().toISOString()
    });
    if (pErr) console.warn('[YourPass] Profil non créé:', pErr.message);
  }

  // Supabase peut exiger une confirmation email selon les paramètres du projet
  if (!data.session) {
    showMsg('register-msg', '✅ Compte créé ! Vérifie ta boîte email pour confirmer.', 'success');
  } else {
    localStorage.setItem('yourpass_user', JSON.stringify({
      id: data.user.id, email,
      name: `${firstname} ${lastname}`.trim()
    }));
    showMsg('register-msg', '✅ Compte créé avec succès ! Redirection…', 'success');
    // La redirection est gérée par onAuthStateChange
  }
});

/* ── Enter key sur register ─────────────────────────────────── */
['reg-firstname','reg-lastname','reg-email','reg-password'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('reg-submit').click();
  });
});

/* ════════════════════════════════════════════════════════════
   MOT DE PASSE OUBLIÉ
════════════════════════════════════════════════════════════ */
document.getElementById('forgot-link').addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();

  if (!email) {
    showMsg('login-msg', "Entre d'abord ton email, puis clique ici.", 'error');
    document.getElementById('login-email').focus();
    return;
  }

  const { error } = await _sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + '/connexion.html'
  });

  if (error) {
    showMsg('login-msg', translateErr(error.message), 'error');
  } else {
    showMsg('login-msg', `📧 Email de réinitialisation envoyé à ${email}`, 'success');
  }
});
</script>

</body>
</html>
