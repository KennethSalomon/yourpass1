<!-- Bouton son -->
<button id="sound-btn">🔇</button>

<!-- Contenu du site -->
<div>
    <div class="wrapper">
             <nav class="nav">
       <div class="nav-logo">
        <div class="logo-container">
<!--- <img src="image/Vlogo.png" alt="Your Pass Logo" id="logoWing">  --->
</div>
<div class="Logo">
    <img src="image video/téléchargement (1).png" alt="YourPass Logo">
 </div> 
       </div>
       <div class="nav-menu" id="navMenu">
           <ul>
               <li><a href="index.html" class="link">Accueil</a></li>
                <li><a href="events.html" class="link">Événements</a></li>
                <li><a href="ads.html" class="link">Partenaires</a></li>
                <li><a href="connexion.html" class="link">Connexion</a></li>
                <li><a href="contact.html" class="link">Contact</a></li>
           </ul>
       </div>
         
           <div class="button">
             <button class="btn white-btn" id="loginBtn" onclick="login()">Sign In</button>
             <button class="btn" id="registerBtn" onclick="register()" >Sign Up</button>
           </div>
            <div class="nav-menu-btn">
                <i class="bx bx-menu" onclick="myMenuFunction()" ></i>
            </div>
         
    </nav>
        
    
    <!-------------------------------------------form box--------------------------->
    <div class="form-box">
         <!-------------------------------------Login form------------------------>
        <div class="login-container" id="login">
            <div class="top">
                <span>Don't have an account ?<a href="#" onclick="register()" >Sign Up</a></span>
                <header>Login</header>
            </div>
                <div class="input-box" >
                    <input type="text" class="input-field" placeholder="Username or Email">
                    <i class="bx bx-user"></i>
                </div>
                <div class="input-box" >
                    <input type="password" class="input-field" placeholder="password">
                    <i class="bx bx-lock-alt"></i>
                </div>
                <div class="input-box" >
                    <input type="submit" class="submit" value="Sign In">
                </div>
                <div class="two-col">
                    <div class="one"> 
                        <input type="checkbox" id="login-check">
                        <label for="login-check">Remenber Me</label>
                    </div>
                      <div class="two">
                        <label ><a href="#">Forgot password?</a></label>
                      </div>
                </div>
            </div>

         <!-------------------------------------register form------------------------>
         <div class="register-container" id="register">
             <div class="top">
                <span>Have an account ?<a href="#" onclick="login()" >Login</a></span>
                <header>Sign Up</header>
            </div>
            <div class="two-forms">
                <div class="input-box" >
                    <input type="text" class="input-field" placeholder="Firstname">
                    <i class="bx bx-user"></i>
                </div> 
                <div class="input-box" >
                    <input type="text" class="input-field" placeholder="Lastname">
                    <i class="bx bx-user"></i>
                </div>
            </div>    
                <div class="input-box" >
                    <input type="text" class="input-field" placeholder="Email">
                    <i class="bx bx-envelope"></i>
                </div>
                <div class="input-box" >
                    <input type="password" class="input-field" placeholder="password">
                    <i class="bx bx-lock-alt"></i>
                </div>
                <div class="input-box" >
                    <input type="submit" class="submit" value="Register">
                </div>
                <div class="two-col">
                   <div class="one"> 
                        <input type="checkbox" name="" id="register-check">
                        <label for="register-check">Remenber Me</label>
                    </div>
                    <div class="two">
                        <label ><a href="#">Terms & conditions</a></label>
                    </div>  
                </div>
         </div>
        </div>
    </div>
</div>


<script src="js/main.js"></script>
</body>
